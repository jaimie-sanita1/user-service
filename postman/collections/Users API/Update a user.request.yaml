$kind: http-request
method: PUT
url: '{{baseUrl}}/users/:id'
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: ''
body:
  type: json
  content: |-
    {
      "name": "string",
      "email": "user@example.com",
      "role": "admin",
      "status": "active"
    }
