$kind: http-example
name: 201 Created
request:
  url: '{{baseUrl}}/users'
  method: POST
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "usr_004",
        "name": "Test User",
        "email": "testuser@example.com",
        "role": "member",
        "status": "active",
        "createdAt": "2024-03-13T15:30:00.000Z"
      }
order: 1000
