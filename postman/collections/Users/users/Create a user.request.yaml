$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "email": "john.doe@example.com",
      "role": "member",
      "status": "active"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string"
        },
        "email": {
          "type": "string",
          "format": "email"
        },
        "role": {
          "type": "string",
          "enum": [
            "admin",
            "member"
          ]
        },
        "status": {
          "type": "string",
          "enum": [
            "active",
            "inactive",
            "suspended"
          ],
          "description": "Optional; defaults to active if omitted"
        }
      },
      "required": [
        "name",
        "email",
        "role"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      const requestBody = JSON.parse(pm.request.body.raw || "{}");

      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Security headers are present", function () {
          ["X-Content-Type-Options", "X-Frame-Options"].forEach(function (header) {
              pm.expect(pm.response.headers.has(header), `Missing ${header}`).to.be.true;
          });
      });

      pm.test("Response time is under 500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(500);
      });

      pm.test("Response contains user object", function () {
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("name");
          pm.expect(jsonData).to.have.property("email");
          pm.expect(jsonData).to.have.property("role");
          pm.expect(jsonData).to.have.property("status");
          pm.expect(jsonData).to.have.property("createdAt");
      });

      pm.test("No sensitive fields are exposed", function () {
          ["password", "passwordHash", "ssn", "token", "secret"].forEach(function (field) {
              pm.expect(jsonData).to.not.have.property(field);
          });
      });

      pm.test("Created resource reflects the submitted identity fields", function () {
          pm.expect(jsonData.name).to.eql(requestBody.name);
          pm.expect(jsonData.email).to.eql(requestBody.email);
          pm.expect(jsonData.role).to.eql(requestBody.role);
      });
    language: text/javascript
examples: ./.resources/Create a user.resources/examples
order: 3000
