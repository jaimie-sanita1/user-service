$kind: http-request
url: "{{baseUrl}}/users/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: string
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "<string>"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Security headers are present", function () {
          ["X-Content-Type-Options", "X-Frame-Options"].forEach(function (header) {
              pm.expect(pm.response.headers.has(header), `Missing ${header}`).to.be.true;
          });
      });

      pm.test("Response time is less than 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });

      pm.test("Response contains expected user fields", function () {
          ["id", "name", "email", "role", "status", "createdAt"].forEach(function (field) {
              pm.expect(jsonData).to.have.property(field);
          });
      });

      pm.test("No sensitive fields are exposed", function () {
          ["password", "passwordHash", "ssn", "token", "secret"].forEach(function (field) {
              pm.expect(jsonData).to.not.have.property(field);
          });
      });
    language: text/javascript
examples: ./.resources/Get a user by ID.resources/examples
order: 1000
