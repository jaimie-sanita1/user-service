$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: <string>
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000
