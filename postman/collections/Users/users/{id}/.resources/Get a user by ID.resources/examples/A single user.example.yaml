$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "name": "string",
        "email": "jURUlYkO2U@DVgHcqXiggqeDjDblvi.qtvu",
        "role": "member",
        "status": "suspended",
        "createdAt": "2010-03-11T06:12:56.098Z"
      }
