$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "name": "string",
        "email": "CTL87mOiFlAl@NNTPRPUxpwf.pd",
        "role": "member",
        "status": "active"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
  body:
    type: json
    content: |-
      {
        "id": "string",
        "name": "Jane Smith",
        "email": "jane.smith@example.com",
        "role": "admin",
        "status": "active",
        "createdAt": "2010-03-11T06:12:56.098Z",
        "updatedAt": "2024-01-15T10:30:00Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "description": "Unique identifier for the user"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "role": {
            "type": "string",
            "enum": [
              "admin",
              "member"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "inactive",
              "suspended"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "name",
          "email",
          "role",
          "status",
          "createdAt"
        ]
      }
order: 1000
