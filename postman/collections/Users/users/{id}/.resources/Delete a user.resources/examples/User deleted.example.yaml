$kind: http-example
request:
  url: "{{baseUrl}}/users/:id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: <string>
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
