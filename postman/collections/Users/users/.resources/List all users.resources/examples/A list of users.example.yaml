$kind: http-example
request:
  url: "{{baseUrl}}/users"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "<string>",
          "name": "<string>",
          "email": "<email>",
          "role": "member",
          "status": "suspended",
          "createdAt": "<dateTime>"
        },
        {
          "id": "<string>",
          "name": "<string>",
          "email": "<email>",
          "role": "admin",
          "status": "inactive",
          "createdAt": "<dateTime>"
        }
      ]
    $type: |-
      {
        "type": "array",
        "items": {
          "type": "object",
          "properties": {
            "id": {
              "type": "string",
              "description": "Unique identifier for the user"
            },
            "name": {
              "type": "string"
            },
            "email": {
              "type": "string",
              "format": "email"
            },
            "role": {
              "type": "string",
              "enum": [
                "admin",
                "member"
              ]
            },
            "status": {
              "type": "string",
              "enum": [
                "active",
                "inactive",
                "suspended"
              ]
            },
            "createdAt": {
              "type": "string",
              "format": "date-time"
            }
          },
          "required": [
            "id",
            "name",
            "email",
            "role",
            "status",
            "createdAt"
          ]
        }
      }
order: 1000
