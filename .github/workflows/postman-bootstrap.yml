name: Postman Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - 'users.yaml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serve OpenAPI spec locally
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Bootstrap Postman workspace
        uses: postman-cs/postman-bootstrap-action@v0
        with:
          project-name: user-service
          spec-url: http://localhost:8080/users.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          workspace-id: 83761f22-e042-47eb-9fa9-51f53acf2d6c
          spec-id: 6f430f6a-0ea2-42fa-bdd3-54f519fbc30e
